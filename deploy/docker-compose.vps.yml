            # petite réverbération : quelques échos amortis
            wet = np.zeros_like(buf)
            for delay, g in ((0.11, 0.3), (0.23, 0.2), (0.37, 0.12)):
                d = int(delay * SR)
                wet[d:] += buf[:-d] * g
