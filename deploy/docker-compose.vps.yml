        FROM python:3.12-slim-bookworm AS assets
        RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg espeak-ng \
            && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir numpy pillow
        WORKDIR /src
        COPY --from=src /tools ./tools
        COPY --from=src /music ./music
        RUN python tools/make_music.py && python tools/make_demo.py && python tools/make_icons.py /src/icons

        FROM node:22-alpine AS web
        WORKDIR /web
        COPY --from=src /frontend/package.json /frontend/package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY --from=src /frontend/ ./
        COPY --from=assets /src/icons/ ./public/
        RUN npm run build

        FROM python:3.12-slim-bookworm
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1 PIP_NO_CACHE_DIR=1
        RUN apt-get update && apt-get install -y --no-install-recommends \
              ffmpeg libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
              fonts-lato fonts-dejavu-core fonts-liberation tzdata \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY --from=src /backend/requirements.txt .
        RUN pip install -r requirements.txt
        COPY --from=src /backend/app ./app
        COPY --from=assets /src/music ./music
        COPY --from=assets /src/demo ./demo
        COPY --from=web /web/dist ./static
        RUN useradd -u 1000 -m souvenirs && mkdir /data && chown souvenirs /data
        USER souvenirs
        VOLUME /data
        EXPOSE 8000
        CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    pull_policy: build
    image: souvenirs:latest
    restart: unless-stopped
    environment: *env
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.souvenirs.rule=Host(`${DOMAIN:?Renseigne DOMAIN}`)
      - traefik.http.routers.souvenirs.entrypoints=${TRAEFIK_ENTREE:-websecure}
      - traefik.http.routers.souvenirs.tls=true
      - traefik.http.routers.souvenirs.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.souvenirs.middlewares=souvenirs-headers
      - traefik.http.middlewares.souvenirs-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.souvenirs-headers.headers.frameDeny=true
      - traefik.http.middlewares.souvenirs-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow, noarchive
      - traefik.http.middlewares.souvenirs-headers.headers.permissionsPolicy=microphone=(self), camera=(self), geolocation=()
      - traefik.http.services.souvenirs.loadbalancer.server.port=8000

  # Tâches de fond : préparation des médias, transcription Whisper, appels Claude,
  # montage FFmpeg, album PDF, purge automatique des fichiers bruts.
  worker:
    pull_policy: never
    image: souvenirs:latest
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *env
    volumes:
      - data:/data
    depends_on:
      app:
        condition: service_started

volumes:
  data:   # médias bruts, résultats, base SQLite, modèle Whisper
